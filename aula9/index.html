<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Nova Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    

  <main>
    <img src="../Logopxmaior.png" alt="Logo Action Nova Games" width="200">
    <h1>🎮 Catálogo</h1>

    <div class="card" id="promocao">
      <h4>Promoção do dia </h4>
      <img src="../PS5.png" alt="Imagem do PS5" width="250">
      <p>PS5 sem mídia digital por apenas R$ 1899,99</p>
    </div>

    <div class="card destaque">
      <h4>Jogos Novos e seminovos</h4>
      <img src="../jogos.png" alt="Imagem dos jogos" width="300">
      <p>A partir de R$ 109,00</p>
    </div>

    <div class="card">
      <h4>Consoles retrô</h4>
      <img src="../Consoleretro.png" alt="Imagem dos consoles" width="250">
      <p>A partir de R$ 79,50</p>
    </div>

    <div class="card">
      <h4>Controles Novos, seminovos e usados</h4>
      <img src="../Controles.png" alt="Imagem dos controles" width="250">
      <p>A partir de R$ 39,50</p>
    </div>

    <div class="card esgotado">
      <h4>Chaveiros personalizados</h4>
      <img src="../Chaveiros.png" alt="Imagem dos chaveiros" width="250">
      <p>Volta somente na próxima semana! R$ 7,00</p>
    </div>
  </main>
  <a href="../index.html"><button style = "background-color: #ffffff;
     color:#0011ff;
     border:3px solid #ff0000; 
     border-radius: 20px;
     width: 70px; height: 40px;">Voltar</button></a>

</body>
</html>
