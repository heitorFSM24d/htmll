<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS Interno</title>
  <!--
    FORMA 2: CSS INTERNO
    O estilo fica reunido na tag <style>, dentro do <head>.
      -->
  
</head>
<style>
    header{
        background-color: #463618;
    } header h1{
        color: #eee7ad;
        margin: 0;
        padding: 10px;
        font-family: Comic Sans MS, sans-serif;
        text-align: center;
    }header p {
        color: #eee7ad;
        margin: 0;
        padding: 5px;
        font-family: Arial, sans-serif;
        text-align: center;
        }
    body{
        background-color: #eee7ad;
    }main{
        padding: 10px;
        width: 480px;
        margin: auto;
    }main h2{
        text-align: center;
        font-family: Helvetica, sans-serif;
        color: #463618;
    }
    section{
        background-color: #fffde6;
        border: 5px solid #58432c;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 15px;
    }
    section h3{
        color: #463618;
        font-family: Palatino, sans-serif;
        margin: 0;
    }
    section p {
    margin: 16px 0 0 0;
    font-family: Verdana, sans-serif;
    color: #463618;
    }
    footer{
        background-color: #463618;
        color: #eee7ad;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 10px;
        color: #eee7ad;
    }
</style>
<body>

  <header>
    <h1>☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>

</body>
</html>
